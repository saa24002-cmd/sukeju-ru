<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みんなのスケジュール管理 - SukeJule</title>
</head>
<body>
  <header>
    <div>
      <h1>📅 みんなのスケジュール管理</h1>
      <div id="user-info">
        <img id="user-photo" src="" alt="アイコン">
        <span id="user-name"></span>
        <button id="logout-btn">ログアウト</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ログイン前画面 -->
    <section id="login-section">
      <h2>予定をスマートに管理・共有しよう</h2>
      <p>Googleアカウントでログインすると、あなた専用のスケジュールをクラウドに保存できます。</p>
      <button id="login-btn">Googleアカウントでログイン</button>
    </section>

    <!-- ログイン後メイン画面 -->
    <div id="app-section">
      <div>
        <!-- 左カラム：予定登録フォーム＆自分のスケジュール -->
        <div>
          <section>
            <h2 id="form-title">✏️ 新しい予定を追加</h2>
            <form id="schedule-form">
              <input type="hidden" id="edit-id">
              <div>
                <label for="title">予定のタイトル *</label>
                <input type="text" id="title" placeholder="例：プログラミング課題の提出、ゼミ発表" required>
              </div>
              <div>
                <div>
                  <label for="date">日付 *</label>
                  <input type="date" id="date" required>
                </div>
                <div>
                  <label for="time">時間（任意）</label>
                  <input type="time" id="time">
                </div>
              </div>
              <div>
                <label for="category">カテゴリ *</label>
                <select id="category" required>
                  <option value="勉強・課題">📚 勉強・課題</option>
                  <option value="仕事・バイト">💼 仕事・バイト</option>
                  <option value="プライベート">🏠 プライベート</option>
                  <option value="重要イベント">⭐ 重要イベント</option>
                </select>
              </div>
              <div>
                <label for="memo">メモ・場所など</label>
                <textarea id="memo" rows="2" placeholder="例：3号館201教室、ノートPC持参"></textarea>
              </div>
              <div>
                <input type="checkbox" id="is-public" checked>
                <label for="is-public">この予定を「みんなのスケジュール」に公開する</label>
              </div>
              <div>
                <button type="submit" id="submit-btn">予定を保存する</button>
                <button type="button" id="cancel-edit-btn">キャンセル</button>
              </div>
            </form>
          </section>

          <section>
            <div>
              <h2>📋 あなたの予定（<span id="my-count">0</span>件）</h2>
              <div>
                <button type="button" data-filter="all">すべて</button>
                <button type="button" data-filter="active">未完了</button>
                <button type="button" data-filter="completed">完了済み</button>
              </div>
            </div>
            <div id="my-schedules-list">
              <p>読み込み中...</p>
            </div>
          </section>
        </div>

        <!-- 右カラム：ランキング＆みんなの公開スケジュール -->
        <div>
          <section>
            <h2>🏆 予定達成ランキング</h2>
            <p>完了した予定の数トップ5</p>
            <ol id="ranking-list">
              <li>読み込み中...</li>
            </ol>
          </section>

          <section>
            <h2>🌍 みんなの最新スケジュール</h2>
            <div id="public-schedules-list">
              <p>読み込み中...</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
